# Configuration for da_agent

budgets:
  max_llm_calls: 15
  max_tool_calls: 25
  max_replans: 3
  max_identical_retries: 2
  per_call_timeout_s: 60.0
  max_total_tokens: 30000

model:
  name: "qwen3:4b"  # Chosen via D-023; fallback is "qwen3:8b"
  provider: "ollama"  # or llama.cpp / local server
  base_url: "http://localhost:11434/v1"
  temperature: 0.0
  top_p: 1.0
  seed: 42
  answer_narrative_enabled: true  # second LLM call for grounded user-facing prose

sampling:
  seed: 42
  temperature: 0.0

input_limits:
  max_file_size_mb: 50.0
  max_rows: 100000
  allowed_extensions:
    - ".csv"
    - ".xlsx"

run_trace:
  base_dir: "runs"

evaluation:
  per_question_budget_s: 300.0
  overall_timeout_s: 7200.0
  max_repair_attempts: 2
  max_llm_calls_per_question: 8
  thinking_enabled: false
  keep_alive: "10m"

claim_validation:
  rtol: 0.001
  atol: 0.01
  rounding_digits: 4
  allow_recomputation: true
  drop_policy: "drop_finding"

recovery_limits:
  identical_retry_cap: 2
  repair_attempts_per_task: 2
  replans_per_question: 3
