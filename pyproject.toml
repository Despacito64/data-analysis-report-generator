[project]
name = "da-agent"
version = "0.1.0"
description = "Deterministic dynamic data analysis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "langgraph>=0.2.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/da_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
